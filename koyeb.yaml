name: telegram-media-bot
services:
  - name: web
    docker:
      image: python:3.11-slim
    build:
      command: 
        - pip install -r requirements.txt
    run:
      command: uvicorn main:app --host 0.0.0.0 --port $PORT
    env:
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
